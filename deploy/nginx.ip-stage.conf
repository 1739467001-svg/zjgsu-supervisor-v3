# 隔离HTTPS验收；正式切换时仅将listen改成443，80入口另行切换。
limit_req_zone $binary_remote_addr zone=zjgsu_v3_login:10m rate=2r/s;
server {
    listen 127.0.0.1:9443 ssl;
    server_name 121.196.217.243;
    ssl_certificate /etc/letsencrypt/live/121.196.217.243/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/121.196.217.243/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 21m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location ~ ^/api/trpc/.*auth\.loginByEmployeeId {
        limit_req zone=zjgsu_v3_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
